# Checks the app (lint, tests, build) and publishes dist/ to Cloudflare Pages
# (https://ost.francoisbotha.io/, the main address) and to GitHub Pages (a mirror).
# Repository secret needed: CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit).
# Repository setting needed once: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# The least the job needs: read the code, publish a Pages deployment, and prove who is publishing.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push waits for the one in progress rather than cancelling it,
# so a deployment is never left half done.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Type-checks, builds, and fails if the built app lacks its Content Security Policy
      # or names another origin (config/csp.ts).
      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload dist/
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # The same build goes to both hosts.
      - name: Keep dist/ for the Cloudflare job
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          include-hidden-files: true

  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Fetch dist/
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4.80.0 pages deploy dist --project-name ombuto-ost --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
